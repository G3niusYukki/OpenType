name: OpenType
options:
  bundleIdPrefix: com.opentype
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: 0.15.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.0

# Mirrors Package.swift's strict layer DAG:
#   Models → Utilities → Data → Providers → Services → OpenTypeUI → App
# Circular dependencies are prevented by only declaring deps from upper → lower.
targets:
  Models:
    type: framework
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: Sources/Models
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: Models

  Utilities:
    type: framework
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: Sources/Utilities
    dependencies:
      - target: Models
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: Utilities

  Data:
    type: framework
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: Sources/Data
    dependencies:
      - target: Models
      - target: Utilities
      - package: SQLite
      - package: KeychainAccess
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: Data

  Providers:
    type: framework
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: Sources/Providers
    dependencies:
      - target: Models
      - target: Utilities
      - target: Data
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: Providers

  Services:
    type: framework
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: Sources/Services
    dependencies:
      - target: Models
      - target: Providers
      - target: Utilities
      - target: Data
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: Services

  OpenTypeUI:
    type: framework
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: Sources/UI
    dependencies:
      - target: Utilities
      - target: Models
      - target: Data
      - target: Services
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: OpenTypeUI

  OpenType:
    type: application
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - path: Sources/App
    resources:
      - path: Resources
    dependencies:
      - target: Services
      - target: Providers
      - target: Models
      - target: Data
      - target: Utilities
      - target: OpenTypeUI
      - package: SQLite
      - package: Sparkle
      - package: KeychainAccess
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: OpenType
        CFBundleDisplayName: OpenType
        CFBundleIdentifier: com.opentype.macos
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.3.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: OpenType
        CFBundleIconFile: OpenType.icns
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: "OpenType needs microphone access to record your voice for transcription."
        NSSpeechRecognitionUsageDescription: "OpenType uses speech recognition to transcribe your voice."
        SUFeedURL: "https://github.com/G3niusYukki/OpenType/releases/latest/download/appcast.xml"
    entitlements:
      path: Resources/OpenType.entitlements
      properties:
        com.apple.security.device.microphone: true
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.network.client: true
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.opentype.macos
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/OpenType.entitlements
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  OpenType:
    build:
      targets:
        OpenType: all
    run:
      config: Debug
