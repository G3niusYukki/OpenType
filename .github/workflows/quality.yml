name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Swift Project
        run: |
          cd OpenType
          swift build

      - name: Run Swift Tests
        run: |
          cd OpenType
          swift test

      - name: Install and Run Swift Format
        run: |
          brew install swift-format
          swift-format lint --recursive OpenType/Sources --strict
