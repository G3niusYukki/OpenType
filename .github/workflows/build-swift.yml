name: Build OpenType

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-swift:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Swift Project
        run: |
          cd OpenType
          swift build

      - name: Run Swift Tests
        run: |
          cd OpenType
          swift test

      - name: Build Release Archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd OpenType
          swift build -c release

  release:
    needs: build-swift
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release
        run: |
          cd OpenType
          swift build -c release

      - name: Create App Bundle
      - name: Create App Bundle
        run: |
          mkdir -p OpenType.app/Contents/MacOS
          mkdir -p OpenType.app/Contents/Resources
          cp OpenType/.build/release/OpenType OpenType.app/Contents/MacOS/
          cp OpenType/Resources/Info.plist OpenType.app/Contents/

      - name: Create DMG
        run: |
          mkdir -p dmg_root
          cp -R OpenType.app dmg_root/
          hdiutil create -volname "OpenType" -srcfolder dmg_root -ov -format UDZO OpenType.dmg

      - name: Extract Release Notes
        id: notes
        run: |
          NOTES=$(cat RELEASE.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: OpenType.dmg
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
