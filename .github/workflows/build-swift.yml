name: Build OpenType

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-swift:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Swift Project
        run: |
          cd OpenType
          swift build

      - name: Run Swift Tests
        run: |
          cd OpenType
          swift test

      - name: Build Release Archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd OpenType
          xcodegen generate
          xcodebuild -project OpenType.xcodeproj -scheme OpenType -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES build

  release:
    needs: build-swift
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release via XcodeGen
        run: |
          cd OpenType
          brew install xcodegen
          xcodegen generate
          xcodebuild -project OpenType.xcodeproj -scheme OpenType -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES build

      - name: Locate built .app
        id: locate
        run: |
          cd OpenType
          APP_PATH=$(find build/Build/Products/Release -maxdepth 2 -name "OpenType.app" -type d | head -n 1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Built app: $APP_PATH"

      - name: Patch Info.plist version (defense in depth — xcodegen should already set this)
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.3.0" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1"           "$APP/Contents/Info.plist"

      - name: Re-sign with ad-hoc identity (preserves embedded Sparkle framework signature)
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          # Sign nested frameworks first (Sparkle), then the app itself.
          for fw in "$APP/Contents/Frameworks/"*.framework; do
            [ -d "$fw" ] && codesign --force --sign - --timestamp=none "$fw"
          done
          codesign --force --deep --sign - --timestamp=none --entitlements OpenType/Resources/OpenType.entitlements "$APP"

      - name: Verify ad-hoc signature
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          codesign --verify --verbose=2 "$APP" || true   # don't fail the build; ad-hoc is by definition not notarized
          spctl --assess --type execute --verbose=2 "$APP" 2>&1 | tee /tmp/spctl.log || true

      - name: Create DMG
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          mkdir -p dmg_root
          cp -R "$APP" dmg_root/
          hdiutil create -volname "OpenType" -srcfolder dmg_root -ov -format UDZO OpenType.dmg

      - name: Extract Release Notes
        id: notes
        run: |
          NOTES=$(cat RELEASE.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: OpenType.dmg
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
